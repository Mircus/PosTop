<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PosTop logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f1729" />
      <stop offset="100%" stop-color="#0b3b36" />
    </linearGradient>
    <linearGradient id="adjLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="adjRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <marker id="tick" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M6,1 L6,9" stroke="#34d399" stroke-width="2" />
    </marker>
  </defs>

  <rect width="480" height="220" rx="26" fill="url(#bg)" />

  <!-- Left node cluster: S (generators) -->
  <circle cx="120" cy="88" r="34" fill="#151a3a" stroke="#34d399" stroke-width="3" />
  <text x="120" y="94" text-anchor="middle" font-family="'Space Mono','Segoe UI',monospace" font-size="20" fill="#a7f3d0">S</text>

  <!-- Right node cluster: X (points) -->
  <circle cx="300" cy="88" r="34" fill="#101c33" stroke="#5eead4" stroke-width="3" />
  <text x="300" y="94" text-anchor="middle" font-family="'Space Mono','Segoe UI',monospace" font-size="20" fill="#a7f3d0">X</text>

  <!-- ext / box adjunction: two opposed arrows -->
  <path d="M158 76 C 200 60, 240 60, 262 76" fill="none" stroke="url(#adjLeft)" stroke-width="5" stroke-linecap="round" marker-end="url(#tick)" />
  <path d="M262 100 C 240 116, 200 116, 158 100" fill="none" stroke="url(#adjRight)" stroke-width="5" stroke-linecap="round" marker-end="url(#tick)" />
  <text x="210" y="55" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" fill="#5eead4">ext ⊣ box</text>

  <!-- diamond / rest adjunction: mirrored below -->
  <path d="M158 128 C 200 144, 240 144, 262 128" fill="none" stroke="url(#adjLeft)" stroke-width="5" stroke-linecap="round" marker-end="url(#tick)" opacity="0.85" />
  <path d="M262 152 C 240 168, 200 168, 158 152" fill="none" stroke="url(#adjRight)" stroke-width="5" stroke-linecap="round" marker-end="url(#tick)" opacity="0.85" />
  <text x="210" y="183" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" fill="#5eead4">diamond ⊣ rest</text>

  <!-- Wordmark -->
  <text x="360" y="100" text-anchor="middle" font-family="'Gill Sans','Segoe UI',sans-serif" font-size="38" font-weight="600" fill="#f0fdfa">PosTop</text>
  <text x="360" y="126" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#5eead4" opacity="0.9">Positive Topology</text>
</svg>
