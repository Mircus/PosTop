[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postop"
version = "0.2.0"
description = "A reference implementation of the forcing-matrix view of Positive Topology"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mirco A. Mannucci"},
    {name = "Giovanni Sambin"},
]
keywords = [
    "positive topology",
    "formal topology",
    "constructive mathematics",
    "grounded inference",
    "knowledge representation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/Mircus/PosTop"
Repository = "https://github.com/Mircus/PosTop"
Issues = "https://github.com/Mircus/PosTop/issues"
Changelog = "https://github.com/Mircus/PosTop/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
